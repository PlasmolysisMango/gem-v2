# Gem（璀璨宝石）内网站点：nginx 发静态资源，Go 只在 127.0.0.1:9096 提供 API/WS。
# 对外由 443 的 /gem/ 反代到这里，见 /etc/nginx/snippets/gem.conf。
#
# 安装：deploy/deploy.sh（会复制本文件并 reload nginx）
# 前端产物：/usr/share/nginx/gem（由 deploy.sh 原子发布）
server {
    # 只供 443 的 /gem/ 反代使用，不直接对外
    listen 127.0.0.1:9095;
    server_name _;

    root /usr/share/nginx/gem;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite 产物名带指纹，可以永久缓存。缺失就是缺失，不能回落到外壳：浏览器拿到
    # text/html 当 JS 执行，会报 MIME 错并白屏。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # 外壳是唯一指向当前产物名的文件，缓存旧版会把浏览器钉在旧 bundle 上。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # 长连接。Upgrade/Connection 必须显式透传，否则握手永远 400。
    location = /ws {
        proxy_pass http://127.0.0.1:9096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态资源不存在就是不存在，不能回落成 index.html。
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
