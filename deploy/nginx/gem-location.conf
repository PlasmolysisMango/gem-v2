# Gem（璀璨宝石）挂在 443 的 /gem/ 子路径。
#
# 安装：deploy/deploy.sh 会把本文件复制为 /etc/nginx/snippets/gem.conf，并在
# /etc/nginx/conf.d/ip-https.conf 的 server 块内确保有：
#     include /etc/nginx/snippets/gem.conf;
#
# 内部站点：127.0.0.1:9095（静态 + API/WS 反代）
# 后端：127.0.0.1:9096（只监听回环）

location = /gem {
    return 301 /gem/;
}

# 指纹静态资源不鉴权，减少每页多次 auth 子请求。
location ^~ /gem/assets/ {
    proxy_pass http://127.0.0.1:9095/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket 单独匹配，透传 Upgrade。
location = /gem/ws {
    set $entry_service gem;
    include /etc/nginx/snippets/entry-auth.conf;
    include /etc/nginx/snippets/entry-proxy.conf;
    proxy_pass http://127.0.0.1:9095/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    error_page 401 = @entry_api_401;
    error_page 403 = @entry_api_403;
}

location ^~ /gem/api/ {
    set $entry_service gem;
    include /etc/nginx/snippets/entry-auth.conf;
    include /etc/nginx/snippets/entry-proxy.conf;
    proxy_pass http://127.0.0.1:9095/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    error_page 401 = @entry_api_401;
    error_page 403 = @entry_api_403;
}

location ^~ /gem/ {
    set $entry_service gem;
    include /etc/nginx/snippets/entry-auth.conf;
    include /etc/nginx/snippets/entry-proxy.conf;
    proxy_pass http://127.0.0.1:9095/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    error_page 401 = @entry_login;
    error_page 403 = @entry_forbidden;
}
